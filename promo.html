<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Grumpy's Trivia</title>
  <style>
    /* Promo screen for a smaller TV in another room: one big message at a time.
       Sizes use --u, one pixel of a 1920x1080 screen scaled to the real TV. */
    :root{--u:min(calc(100vw / 1920),calc(100vh / 1080));--accent:#ff4255;--accent-hot:#ff9eaa;--accent-rgb:255 66 85;--accent2-rgb:255 176 58;--muted:#d6d0c7}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#070606;color:#fff}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .display{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:.02em}

    /* Moving two-color background, the same as the main TV */
    .atmosphere{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:#070606}
    .aurora i{position:absolute;border-radius:50%;will-change:transform}
    .aurora i:nth-child(1){width:95vmax;height:95vmax;left:-40vmax;top:-55vmax;background:radial-gradient(closest-side,rgb(var(--accent-rgb) / .38),rgb(var(--accent-rgb) / 0));animation:auroraOne 36s ease-in-out infinite alternate}
    .aurora i:nth-child(2){width:90vmax;height:90vmax;right:-38vmax;bottom:-55vmax;background:radial-gradient(closest-side,rgb(var(--accent2-rgb) / .32),rgb(var(--accent2-rgb) / 0));animation:auroraTwo 44s ease-in-out infinite alternate}
    .aurora i:nth-child(3){width:62vmax;height:62vmax;left:28%;top:8%;background:radial-gradient(closest-side,rgb(var(--accent2-rgb) / .14),rgb(var(--accent2-rgb) / 0));animation:auroraThree 29s ease-in-out infinite alternate}
    @keyframes auroraOne{50%{transform:translate(24vmax,12vmax) scale(1.15)}100%{transform:translate(8vmax,30vmax) scale(.95)}}
    @keyframes auroraTwo{50%{transform:translate(-26vmax,-10vmax) scale(1.1)}100%{transform:translate(-6vmax,-26vmax) scale(1.2)}}
    @keyframes auroraThree{50%{transform:translate(-20vmax,12vmax) scale(1.3)}100%{transform:translate(16vmax,-8vmax) scale(.9)}}

    .promo-screen{position:relative;width:100vw;height:100vh;padding:calc(56*var(--u)) calc(64*var(--u));display:flex;flex-direction:column;gap:calc(40*var(--u))}
    .brand{display:flex;align-items:center;gap:calc(26*var(--u))}
    .brand-logo{width:calc(120*var(--u));height:calc(120*var(--u));border-radius:calc(18*var(--u));background:#fff8ee;padding:calc(6*var(--u));object-fit:contain}
    .brand-kicker{display:flex;align-items:center;gap:calc(14*var(--u));color:var(--accent);font-size:calc(28*var(--u));font-weight:900;letter-spacing:.2em}
    .brand-kicker i{width:calc(14*var(--u));height:calc(14*var(--u));border-radius:50%;background:#ff4255;box-shadow:0 0 14px #ff4255;animation:blink 1.7s ease-in-out infinite}
    .brand-title{font-size:calc(76*var(--u));line-height:1}
    @keyframes blink{50%{opacity:.35;transform:scale(.72)}}

    .promo-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) calc(660*var(--u));gap:calc(60*var(--u));align-items:center}
    .stages{display:grid;align-items:center;min-width:0}
    .stage{grid-area:1/1;display:flex;flex-direction:column;gap:calc(24*var(--u));opacity:0;visibility:hidden;transform:translateY(calc(30*var(--u)));transition:opacity .6s ease,transform .7s cubic-bezier(.2,.9,.3,1),visibility 0s linear .6s}
    .stage.is-active{opacity:1;visibility:visible;transform:none;transition:opacity .6s ease,transform .7s cubic-bezier(.2,.9,.3,1),visibility 0s}

    .pill{align-self:flex-start;display:flex;align-items:center;gap:calc(14*var(--u));padding:calc(14*var(--u)) calc(30*var(--u));border-radius:999px;font-size:calc(32*var(--u));font-weight:900;letter-spacing:.14em}
    .pill-outline{border:2px solid var(--accent);background:rgb(var(--accent-rgb) / .12);color:var(--accent-hot)}
    .pill-live{background:#ff4255}
    .pill-live i{width:calc(14*var(--u));height:calc(14*var(--u));border-radius:50%;background:#fff;animation:blink 1.4s ease-in-out infinite}
    .big-label{font-size:calc(104*var(--u));line-height:1}
    .countdown{font-size:calc(330*var(--u));line-height:.82;color:var(--accent);text-shadow:0 0 calc(80*var(--u)) rgb(var(--accent-rgb) / .45);font-variant-numeric:tabular-nums}
    .countdown.hurry{animation:hurry 1s ease-in-out infinite}
    @keyframes hurry{50%{transform:scale(1.04);text-shadow:0 0 calc(120*var(--u)) rgb(var(--accent-rgb) / .8)}}
    .lead-line{margin-top:calc(14*var(--u));font-size:calc(46*var(--u));font-weight:800;line-height:1.2}
    .lead-line span{color:var(--muted)}
    .lead-line b{color:#ffc440}

    .live-title{font-size:calc(190*var(--u));line-height:.9}
    .live-title em{display:block;font-style:normal;color:var(--accent);text-shadow:0 0 calc(80*var(--u)) rgb(var(--accent-rgb) / .45)}
    .live-progress{display:flex;flex-direction:column;gap:calc(14*var(--u))}
    .live-progress strong{font-size:calc(40*var(--u));font-weight:900}
    .segments{display:grid;grid-template-columns:repeat(var(--count,6),minmax(0,1fr));gap:calc(12*var(--u));max-width:calc(760*var(--u))}
    .segments i{height:calc(18*var(--u));border-radius:999px;background:rgba(255,255,255,.16);transition:background .6s ease,box-shadow .6s ease}
    .segments i.done{background:var(--accent)}
    .segments i.now{background:var(--accent);box-shadow:0 0 calc(24*var(--u)) var(--accent);animation:nowPulse 1.2s ease-in-out infinite}
    @keyframes nowPulse{50%{opacity:.55}}

    .champ{margin-top:calc(14*var(--u));display:flex;align-items:center;gap:calc(28*var(--u));max-width:calc(900*var(--u));padding:calc(26*var(--u)) calc(34*var(--u));border-radius:calc(28*var(--u));border:2px solid rgba(255,196,64,.55);background:rgba(255,196,64,.08)}
    .champ.hidden{display:none}
    .champ-trophy{font-size:calc(84*var(--u));line-height:1;animation:bob 2.6s ease-in-out infinite}
    @keyframes bob{50%{transform:translateY(calc(-8*var(--u))) rotate(-4deg)}}
    .champ small{display:block;color:#ffc440;font-size:calc(26*var(--u));font-weight:900;letter-spacing:.16em}
    .champ-name{font-size:calc(68*var(--u));line-height:1}
    .champ-name span{color:#ffc440}
    .champ-name span.champ-who{color:#fff}

    .qr-card{display:flex;flex-direction:column;align-items:center;gap:calc(20*var(--u));padding:calc(36*var(--u)) calc(40*var(--u));max-height:100%;border-radius:calc(36*var(--u));border:3px solid var(--accent);background:rgba(16,14,14,.9);box-shadow:0 0 calc(90*var(--u)) rgb(var(--accent-rgb) / .38);transition:border-color 1s ease,box-shadow 1s ease}
    .qr-title{font-size:calc(68*var(--u));line-height:1;color:var(--accent);text-align:center}
    .qr-sub{margin-top:calc(-12*var(--u));font-size:calc(32*var(--u));font-weight:800;text-align:center}
    .promo-qr{width:calc(430*var(--u));height:calc(430*var(--u));flex-shrink:0;padding:calc(18*var(--u));border-radius:calc(28*var(--u));background:#fff;animation:qrRing 2.4s ease-in-out infinite}
    .promo-qr img{width:100%;height:100%;display:block;object-fit:contain}
    @keyframes qrRing{0%,100%{box-shadow:0 0 0 calc(4*var(--u)) rgb(var(--accent-rgb) / .35)}50%{box-shadow:0 0 0 calc(12*var(--u)) rgb(var(--accent-rgb) / .1),0 0 calc(50*var(--u)) rgb(var(--accent-rgb) / .4)}}
    .qr-foot{font-size:calc(30*var(--u));font-weight:800;color:var(--muted);text-align:center}

    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>
<link rel="stylesheet" href="halloween-theme.css"><link rel="stylesheet" href="branding.css"><link rel="stylesheet" href="christmas-theme.css?v=1"></head>
<body>
  <div class="atmosphere" aria-hidden="true"><div class="aurora"><i></i><i></i><i></i></div></div>

  <main class="promo-screen">
    <header class="brand promo-left">
      <img id="promoBrandLogo" class="brand-logo" src="assets/grumpys-logo.png" alt="Grumpy's St. Boni logo" />
      <div>
        <div class="brand-kicker"><i></i> LIVE BAR TRIVIA</div>
        <div class="brand-title display">Grumpy's Trivia</div>
      </div>
    </header>

    <div class="promo-body">
      <div class="stages" aria-live="polite">
        <section class="stage" data-stage="starting">
          <div class="pill pill-outline">A NEW ROUND IS STARTING</div>
          <div class="big-label display">Starts in</div>
          <div id="startTimer" class="countdown display">0:30</div>
          <div id="startLine" class="lead-line">Grab your phone and join.</div>
        </section>

        <section class="stage" data-stage="live">
          <div class="pill pill-live"><i></i>ON THE MAIN TV NOW</div>
          <div class="live-title display">Trivia<em>is live!</em></div>
          <div class="live-progress">
            <strong id="liveQuestion">Question 1 of 6</strong>
            <div id="liveSegments" class="segments"></div>
          </div>
          <div id="liveLine" class="lead-line">You can still jump in.</div>
        </section>

        <section class="stage is-active" data-stage="between">
          <div class="big-label display">Next round in</div>
          <div id="betweenTimer" class="countdown display">Soon</div>
          <div id="champCard" class="champ hidden">
            <span class="champ-trophy" aria-hidden="true">🏆</span>
            <div>
              <small>LAST ROUND'S CHAMPION</small>
              <div class="champ-name display"><span id="champName" class="champ-who"></span> <span id="champScore"></span></div>
            </div>
          </div>
        </section>
      </div>

      <aside class="qr-card">
        <div id="qrTitle" class="qr-title display">Scan to play</div>
        <div id="qrSub" class="qr-sub">in the next round</div>
        <div id="promoQrCode" class="promo-qr"><img alt="Scan to play Grumpy's Trivia" src="assets/trivia-qr.png"></div>
        <div id="qrFoot" class="qr-foot">No app needed</div>
      </aside>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="grumpys-auth.js?v=1"></script>
  <script src="round-themes.js?v=2"></script>
  <script src="christmas.js?v=1"></script>
  <script src="promo.js?v=xmas1"></script>
<script src="shared-theme.js"></script></body>
</html>
